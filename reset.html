<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset your password: AID</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f5f2ea; display: flex;
         justify-content: center; padding-top: 8vh; margin: 0; }
  .card { background: #fff; padding: 32px; border-radius: 10px; width: 340px;
          box-shadow: 0 2px 12px rgba(0,0,0,.1); }
  label { display: block; margin-bottom: 4px; }
  input { width: 100%; padding: 8px; margin-bottom: 18px; border: 1px solid #ccc;
          border-radius: 6px; box-sizing: border-box; }
  button { width: 100%; padding: 10px; background: #7a1f1f; color: #fff; border: none;
           border-radius: 6px; font-size: 15px; cursor: pointer; }
  .err { color: #b00020; margin: 0 0 12px; }
  .ok { color: #1a6b1a; margin: 0 0 12px; }
  .muted { margin: 0 0 18px; color: #555; }
  .sub { margin: 16px 0 0; font-size: 14px; color: #555; }
</style>
</head>
<body>
<form class="card" method="POST"
      action="https://mzjfnyjparfdeiohlxoa.supabase.co/functions/v1/mcp-server/recover">
  <h2 style="margin:0 0 6px">Reset your password</h2>
  <p class="muted">Enter the email address of your AID account. You will receive a link to
  choose a new password.</p>
  <p class="err" id="err" hidden></p>
  <p class="ok" id="ok" hidden></p>
  <label>Email</label>
  <input name="email" id="email" type="email" required autocomplete="username">
  <button type="submit">Send reset link</button>
  <p class="sub"><a href="index.html" style="color:#7a1f1f">Back to sign-in</a></p>
</form>
<script>
  var p = new URLSearchParams(location.search);
  if (p.get('email')) {
    document.getElementById('email').value = p.get('email');
  }
  if (p.get('notice') === 'sent') {
    var ok = document.getElementById('ok');
    ok.textContent = 'If this address has an account, a reset link is on its way. Check your ' +
                     'inbox; the link is valid for one hour.';
    ok.hidden = false;
  }
  if (p.get('error')) {
    var el = document.getElementById('err');
    el.textContent = decodeURIComponent(p.get('error'));
    el.hidden = false;
  }
</script>
</body>
</html>
