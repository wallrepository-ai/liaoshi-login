<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-tpl="Choose a new password: {short}">Choose a new password: AID</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f5f2ea; display: flex;
         justify-content: center; padding-top: 8vh; margin: 0; }
  .card { background: #fff; padding: 32px; border-radius: 10px; width: 340px;
          box-shadow: 0 2px 12px rgba(0,0,0,.1); }
  label { display: block; margin-bottom: 4px; }
  input { width: 100%; padding: 8px; margin-bottom: 12px; border: 1px solid #ccc;
          border-radius: 6px; box-sizing: border-box; }
  button { width: 100%; padding: 10px; background: #7a1f1f; color: #fff; border: none;
           border-radius: 6px; font-size: 15px; cursor: pointer; }
  .err { color: #b00020; margin: 0 0 12px; }
  .pw { position: relative; }
  .pw input { padding-right: 40px; }
  .eye { position: absolute; right: 4px; top: 3px; width: 30px; height: 30px; padding: 0;
         margin: 0; background: none; border: none; border-radius: 6px; color: #777;
         cursor: pointer; font-size: 0; line-height: 0; }
  .eye:hover { color: #7a1f1f; }
  .eye svg { width: 20px; height: 20px; }
  .eye .slash { display: none; }
  .eye.on .slash { display: inline; }
  .muted { margin: 0 0 18px; color: #555; }
  .sub { margin: 16px 0 0; font-size: 14px; color: #555; }
</style>
</head>
<body>
<form class="card" method="POST" id="form"
      action="https://mzjfnyjparfdeiohlxoa.supabase.co/functions/v1/mcp-server/password">
  <h2 style="margin:0 0 6px">Choose a new password</h2>
  <p class="muted">For your <span data-name="short">AID</span> account. At least 6 characters.</p>
  <p class="err" id="err" hidden></p>
  <input type="hidden" name="access_token" id="access_token">
  <label>New password</label>
  <div class="pw"><input name="password" type="password" required minlength="6" autocomplete="new-password"><button type="button" class="eye" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><line class="slash" x1="3" y1="3" x2="21" y2="21"/></svg></button></div>
  <label>Repeat password</label>
  <div class="pw"><input name="password2" type="password" required minlength="6" autocomplete="new-password"><button type="button" class="eye" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><line class="slash" x1="3" y1="3" x2="21" y2="21"/></svg></button></div>
  <button type="submit" id="submit">Change password</button>
  <p class="sub"><a href="reset.html" style="color:#7a1f1f">Request a new reset link</a>
  · <a href="index.html" style="color:#7a1f1f">Back to sign-in</a></p>
</form>
<script>
  // The reset email's link lands here with a one-hour token in the URL fragment.
  // The token moves into the form and leaves the address bar.
  var h = new URLSearchParams(location.hash.replace(/^#/, ''));
  var p = new URLSearchParams(location.search);
  var tokenField = document.getElementById('access_token');
  if (h.get('access_token')) {
    tokenField.value = h.get('access_token');
    history.replaceState(null, '', location.pathname + location.search);
  }
  var expired = 'This link has expired or was already used. Request a new one.';
  var msg = '';
  if (p.get('error') === 'expired') {
    msg = expired;
  } else if (p.get('error')) {
    msg = decodeURIComponent(p.get('error'));
  } else if (h.get('error')) {
    msg = expired + (h.get('error_description') ? ' (' + h.get('error_description').replace(/\+/g, ' ') + ')' : '');
  } else if (!tokenField.value) {
    msg = 'Open this page from the link in the reset email.';
  }
  if (msg) {
    var el = document.getElementById('err');
    el.textContent = msg;
    el.hidden = false;
  }
  if (!tokenField.value) {
    document.getElementById('submit').disabled = true;
  }
  Array.prototype.forEach.call(document.querySelectorAll('.eye'), function (b) {
    b.addEventListener('click', function () {
      var i = b.parentNode.querySelector('input');
      var show = i.type === 'password';
      i.type = show ? 'text' : 'password';
      b.classList.toggle('on', show);
      b.title = show ? 'Hide password' : 'Show password';
      b.setAttribute('aria-label', b.title);
    });
  });
</script>
</body>
</html>
